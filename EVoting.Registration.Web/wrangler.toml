name = "evotingregistrationapp"
compatibility_date = "2026-11-04"

# Pure static site — no Worker code (no `main` field).
# Static assets (index.html, js/, css/, favicon.svg) live in this folder.

routes = [
  { pattern = "reg.eballotsacdeco.site", custom_domain = true }
]

[assets]
directory = "."
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
